<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}</style>
</head>
<body>
<title>별빛 트리 광장</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=Noto+Sans+KR:wght@400;500&display=swap">
<style>
/* Layout: full-bleed WebGL night scene; a small name plaque top-left, controls docked bottom-center. Single dark look by choice (it is night). */
:root{
  --night:#0a1029;
  --ink:#f4ecdb;
  --muted:#b3bbd3;
  --ember:#ffbf66;
  --ember-ink:#2a1606;
  --glass:rgba(12,18,44,.66);
  --line:rgba(255,214,150,.24);
  --display:"Gowun Batang","Nanum Myeongjo","AppleMyungjo",serif;
  --body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--night);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}

.hud{
  position:fixed;inset:0;pointer-events:none;
  display:flex;flex-direction:column;justify-content:space-between;gap:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:calc(env(safe-area-inset-top,0px) + 16px) calc(env(safe-area-inset-bottom,0px) + 14px);
}
.plaque{
  align-self:flex-start;max-width:min(340px,100%);
  display:grid;gap:6px;padding:14px 16px;
  background:var(--glass);border:1px solid var(--line);border-radius:14px;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}
.eyebrow{margin:0;font-size:11px;letter-spacing:.14em;color:var(--ember)}
h1{margin:0;font-family:var(--display);font-weight:700;font-size:clamp(23px,4.4vw,31px);line-height:1.15;letter-spacing:-.01em;text-wrap:balance}
.sub{margin:0;font-size:13px;line-height:1.6;color:var(--muted)}
.dday{justify-self:start;margin:2px 0 0;font-size:12px;font-weight:500;padding:3px 10px;border-radius:999px;background:rgba(255,191,102,.14);color:var(--ember);font-variant-numeric:tabular-nums}

.dock{display:grid;gap:10px;justify-items:center}
.controls{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;pointer-events:auto}
.controls button{
  font:inherit;font-size:14px;font-weight:500;color:var(--ink);
  background:var(--glass);border:1px solid var(--line);border-radius:999px;
  min-height:44px;padding:0 16px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  transition:transform .15s ease,background-color .2s ease;
}
.controls button:active{transform:scale(.97)}
.controls button:focus-visible{outline:2px solid var(--ember);outline-offset:3px}
.controls .primary{background:var(--ember);color:var(--ember-ink);border-color:transparent}
.controls .primary:disabled{opacity:.6;cursor:default;transform:none}
.count{font-size:12px;font-variant-numeric:tabular-nums;opacity:.75}
.hint{margin:0;max-width:100%;font-size:12px;line-height:1.5;color:var(--muted);text-align:center;padding:4px 12px;border-radius:999px;background:var(--glass);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}

.tags{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;left:0;top:0;padding:3px 10px;border-radius:999px;background:var(--ink);color:var(--ember-ink);font-size:12px;font-weight:500;line-height:1.5;white-space:nowrap;box-shadow:0 2px 10px rgba(0,0,0,.45);opacity:0;transition:opacity .35s ease;will-change:transform}
.tag::after{content:"";position:absolute;left:50%;bottom:-4px;width:8px;height:8px;margin-left:-4px;background:var(--ink);transform:rotate(45deg);border-radius:1px}
.tag.on{opacity:1}
.toast{margin:0;max-width:100%;font-size:13px;font-weight:500;color:var(--ember);text-align:center;padding:5px 14px;border-radius:999px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.status{margin:0;font-size:12px;line-height:1.5;color:var(--ink);font-variant-numeric:tabular-nums}
.controls.minor button{min-height:38px;font-size:13px;padding:0 13px;color:var(--muted)}
.controls button:disabled{opacity:.5;cursor:default;transform:none}
.tag.me{background:var(--ember);color:var(--ember-ink)}
.tag.me::after{background:var(--ember)}
.say{position:absolute;left:0;top:0;padding:6px 12px;border-radius:12px;background:#fffaf0;color:#2a1606;font-size:13px;font-weight:500;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.45);opacity:0;transition:opacity .3s ease;will-change:transform}
.say::after{content:"";position:absolute;left:50%;bottom:-5px;width:10px;height:10px;margin-left:-5px;background:#fffaf0;transform:rotate(45deg)}
.say.on{opacity:1}
.wishbox{pointer-events:auto;width:min(420px,100%);display:grid;gap:8px;padding:14px;background:var(--glass);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.wishbox label{font-size:13px;font-weight:500;color:var(--ink)}
.wishbox textarea{font:inherit;font-size:16px;line-height:1.5;color:#2a1606;background:#fffaf0;border:0;border-radius:10px;padding:10px 12px;resize:none;min-width:0}
.wishbox textarea:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
.wishrow{display:flex;align-items:center;gap:8px}
.wishcount{margin-right:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.wishrow button{font:inherit;font-size:14px;font-weight:500;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.wishrow button.primary{background:var(--ember);color:var(--ember-ink);border-color:transparent}
.wishrow button:focus-visible{outline:2px solid var(--ember);outline-offset:3px}
.wishnote{margin:0;font-size:12px;color:var(--muted)}
.wishbubble{position:absolute;left:0;top:0;max-width:220px;padding:8px 12px;border-radius:12px;background:#fffaf0;color:#2a1606;box-shadow:0 4px 16px rgba(0,0,0,.5);opacity:0;transition:opacity .35s ease;will-change:transform}
.wishbubble.on{opacity:1}
.wishbubble p{margin:0;font-size:13px;line-height:1.45;font-weight:500;overflow-wrap:anywhere}
.wishbubble span{display:block;margin-top:3px;font-size:11px;color:#7a5a3a}
.namebox{position:fixed;z-index:60;left:50%;top:50%;transform:translate(-50%,-50%);width:min(360px,calc(100% - 32px));display:grid;gap:10px;padding:20px;background:rgba(12,18,44,.92);border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 50px rgba(0,0,0,.5);color:var(--ink)}
.namebox h2{margin:0;font-family:var(--display);font-size:22px;line-height:1.2}
.namebox p{margin:0;font-size:13px;line-height:1.55;color:var(--muted)}
.namebox label{font-size:13px;font-weight:500}
.namebox input{font:inherit;font-size:17px;color:#2a1606;background:#fffaf0;border:0;border-radius:10px;padding:11px 12px;min-width:0}
.namebox input:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
.namebox .namehint{font-size:12px}
.namerow{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.namerow button{font:inherit;font-size:14px;font-weight:500;min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.namerow button.primary{background:var(--ember);color:var(--ember-ink);border-color:transparent}
.namerow button:focus-visible{outline:2px solid var(--ember);outline-offset:3px}
.loading{position:fixed;inset:0;display:grid;place-items:center;align-content:center;gap:10px;padding:24px;text-align:center;background:var(--night);color:var(--ember);font-family:var(--display);font-size:18px;transition:opacity .9s ease}
.loading small{font-family:var(--body);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.loading.done{opacity:0;pointer-events:none}

@media (max-width:480px){
  .sub{display:none}
  .plaque{padding:11px 14px;gap:4px}
  .controls button{font-size:13px;padding:0 13px}
  .tag{font-size:11px;padding:2px 8px}
  .hint{display:none}
  .controls{gap:6px}
  .controls button{padding:0 11px}
}
@media (prefers-reduced-motion:reduce){.loading{transition:none}}
</style>

<div id="stage"></div>
<div class="tags" id="tags" aria-hidden="true"></div>

<div class="hud">
  <header class="plaque">
    <p class="eyebrow">눈 오는 밤 · 마을 한가운데</p>
    <h1>별빛 트리 광장</h1>
    <p class="sub">모닥불에 둘러앉아 소원을 적으면 트리에 걸러 다녀와요. 걸린 종이를 누르면 다른 사람의 소원을 읽을 수 있어요.</p>
    <p class="dday" id="dday">크리스마스까지 D-44</p>
    <p class="status" id="status" role="status">이름을 정하면 모닥불 자리를 찾아요</p>
  </header>
  <div class="dock">
    <p class="toast" id="toast" role="status" aria-live="polite" hidden></p>
    <p class="hint" id="hint">드래그로 둘러보기 · 두 손가락으로 확대 · 친구를 누르면 손을 흔들고 이름을 알려줘요</p>
    <form class="wishbox" id="wishbox" hidden>
      <label for="wishText">트리에 걸 소원이나 걱정을 적어 주세요</label>
      <textarea id="wishText" maxlength="60" rows="2" placeholder="예) 시험이 잘 끝났으면 좋겠어요"></textarea>
      <div class="wishrow">
        <span class="wishcount" id="wishCount">0/60</span>
        <button type="button" id="wishCancel">취소</button>
        <button type="submit" class="primary">트리에 걸기</button>
      </div>
      <p class="wishnote" id="wishNote">적은 글은 광장에 들어오는 모두에게 보여요.</p>
    </form>
    <div class="controls" role="group" aria-label="인사하기">
      <button type="button" class="primary" id="wishBtn" aria-expanded="false" aria-controls="wishbox" disabled>소원 적기</button>
      <button type="button" id="wave" disabled>손 흔들기</button>
      <button type="button" data-say="0" disabled>메리 크리스마스!</button>
      <button type="button" data-say="1" disabled>따뜻하다~</button>
      <button type="button" data-say="2" disabled>반가워요!</button>
    </div>
    <div class="controls minor">
      <button type="button" id="view" disabled>내 모닥불 보기</button>
      <button type="button" id="names" aria-pressed="false">이름표 보기</button>
      <button type="button" id="snow" aria-pressed="true">눈 그치기</button>
      <button type="button" id="spin" aria-pressed="true">회전 멈추기</button>
    </div>
  </div>
</div>

<form class="namebox" id="namebox" hidden>
  <h2>광장에서 쓸 이름</h2>
  <p>모닥불 친구들과 트리에 건 소원에 이 이름이 보여요.</p>
  <label for="nameInput">이름 (12자까지)</label>
  <input id="nameInput" maxlength="12" autocomplete="nickname" enterkeyhint="go" spellcheck="false">
  <p class="namehint" id="nameHint"></p>
  <div class="namerow">
    <button type="button" id="nameShuffle">다른 이름 추천</button>
    <button type="submit" class="primary">모닥불로 가기</button>
  </div>
</form>
<div class="loading" id="loading"><span id="loadMsg">트리에 불을 켜는 중…</span><small id="loadSub">스캔 텍스처 불러오는 중</small></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
(function () {
  /* ---------- D-day ---------- */
  (function () {
    const now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    let xmas = new Date(now.getFullYear(), 11, 25);
    if (today > xmas) xmas = new Date(now.getFullYear() + 1, 11, 25);
    const days = Math.round((xmas - today) / 86400000);
    document.getElementById('dday').textContent = days === 0 ? '오늘은 크리스마스예요' : '크리스마스까지 D-' + days;
  })();

  const loadingEl = document.getElementById('loading');
  const loadMsg = document.getElementById('loadMsg'), loadSub = document.getElementById('loadSub');
  if (!window.THREE || !THREE.OrbitControls || !THREE.GLTFLoader || !THREE.EffectComposer || !THREE.UnrealBloomPass) {
    loadMsg.textContent = '3D 엔진을 불러오지 못했어요.';
    loadSub.textContent = '네트워크 연결을 확인한 뒤 새로고침해 주세요.';
    return;
  }

  THREE.ColorManagement.legacyMode = false;
  const PI = Math.PI, TAU = PI * 2, V3 = THREE.Vector3;

  let seed = 1224;
  const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const rr = (a, b) => a + (b - a) * rnd();
  const pick = a => a[Math.floor(rnd() * a.length)];
  const clamp = (x, a, b) => Math.max(a, Math.min(b, x));

  const coarse = matchMedia('(pointer: coarse)').matches;
  const LOW = coarse || Math.min(innerWidth, innerHeight) < 700;
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!coarse) document.getElementById('hint').textContent = '드래그로 둘러보기 · 휠로 확대 · 친구를 누르면 손을 흔들고 이름을 알려줘요';

  /* ---------- renderer ---------- */
  const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
  const PR = Math.min(devicePixelRatio || 1, LOW ? 1.6 : 2);
  renderer.setPixelRatio(PR);
  renderer.setSize(innerWidth, innerHeight);
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.getElementById('stage').appendChild(renderer.domElement);
  const GL2 = renderer.capabilities.isWebGL2;
  const MSAA = GL2 ? 4 : 0;
  const ANISO = Math.min(8, renderer.capabilities.getMaxAnisotropy());

  const scene = new THREE.Scene();
  const HORIZON = new THREE.Color(0x1a2850);
  scene.background = new THREE.Color(0x060a1a);
  scene.fog = new THREE.FogExp2(HORIZON, 0.0125);

  const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.25, 1400);
  camera.position.set(14, 6.2, 16.5);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 3.2, 0);
  controls.enableDamping = true;
  controls.dampingFactor = 0.07;
  controls.enablePan = false;
  controls.minDistance = 5;
  controls.maxDistance = 44;
  controls.minPolarAngle = 0.3;
  controls.maxPolarAngle = 1.5;
  controls.rotateSpeed = coarse ? 0.6 : 0.75;
  controls.autoRotate = !reduceMotion;
  controls.autoRotateSpeed = 0.3;

  /* ---------- post: HDR render -> bloom -> ACES + sRGB ---------- */
  const rt = new THREE.WebGLRenderTarget(2, 2, { type: GL2 ? THREE.HalfFloatType : THREE.UnsignedByteType, samples: MSAA });
  const composer = new THREE.EffectComposer(renderer, rt);
  composer.addPass(new THREE.RenderPass(scene, camera));
  const bloom = new THREE.UnrealBloomPass(new THREE.Vector2(256, 256), 0.85, 0.55, 1.0);
  composer.addPass(bloom);
  const outPass = new THREE.ShaderPass({
    uniforms: { tDiffuse: { value: null }, exposure: { value: 1.25 } },
    vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
    fragmentShader: [
      'uniform sampler2D tDiffuse; uniform float exposure; varying vec2 vUv;',
      'vec3 fit(vec3 v){ vec3 a = v*(v+0.0245786)-0.000090537; vec3 b = v*(0.983729*v+0.4329510)+0.238081; return a/b; }',
      'vec3 aces(vec3 c){',
      '  const mat3 I = mat3(vec3(0.59719,0.07600,0.02840), vec3(0.35458,0.90834,0.13383), vec3(0.04823,0.01566,0.83777));',
      '  const mat3 O = mat3(vec3(1.60475,-0.10208,-0.00327), vec3(-0.53108,1.10813,-0.07276), vec3(-0.07367,-0.00605,1.07602));',
      '  c *= exposure / 0.6; c = O * fit(I * c); return clamp(c, 0.0, 1.0);',
      '}',
      'vec3 srgb(vec3 c){ return mix(c*12.92, 1.055*pow(c, vec3(1.0/2.4))-0.055, step(0.0031308, c)); }',
      'void main(){',
      '  vec3 c = aces(texture2D(tDiffuse, vUv).rgb);',
      '  float v = smoothstep(0.95, 0.25, length((vUv-0.5)*vec2(1.0,0.85)));',
      '  c *= mix(0.7, 1.0, v);',
      '  gl_FragColor = vec4(srgb(c), 1.0);',
      '}'
    ].join('\n')
  });
  composer.addPass(outPass);

  /* ---------- asset loading ---------- */
  const manager = new THREE.LoadingManager();
  let assetsDone = false;
  manager.onProgress = (url, n, total) => { loadSub.textContent = '스캔 텍스처 불러오는 중 ' + n + '/' + total; };
  manager.onLoad = () => { assetsDone = true; };
  manager.onError = url => { console.warn('불러오지 못한 파일:', url); };
  const texLoader = new THREE.TextureLoader(manager);
  const shared = {};
  function tex(url, srgb, rx = 1, ry = rx) {
    let s = shared[url];
    if (!s) {
      s = shared[url] = { img: null, wait: [] };
      texLoader.load(url, t => { s.img = t.image; s.wait.forEach(v => { v.image = s.img; v.needsUpdate = true; }); });
    }
    const v = new THREE.Texture();
    v.wrapS = v.wrapT = THREE.RepeatWrapping;
    v.repeat.set(rx, ry);
    v.anisotropy = ANISO;
    if (srgb) v.encoding = THREE.sRGBEncoding;
    if (s.img) { v.image = s.img; v.needsUpdate = true; } else s.wait.push(v);
    return v;
  }

  /* ---------- helpers ---------- */
  function M(x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0, sx = 1, sy = sx, sz = sx) {
    return new THREE.Matrix4().compose(new V3(x, y, z), new THREE.Quaternion().setFromEuler(new THREE.Euler(rx, ry, rz)), new V3(sx, sy, sz));
  }
  function prep(geo, color, matrix, groupColors, gain = 1) {
    let g = geo.index ? geo.toNonIndexed() : geo.clone();
    for (const k of Object.keys(g.attributes)) if (k !== 'position' && k !== 'normal') g.deleteAttribute(k);
    if (matrix) g.applyMatrix4(matrix);
    const n = g.attributes.position.count, arr = new Float32Array(n * 3);
    const c = new THREE.Color(color).multiplyScalar(gain);
    for (let i = 0; i < n; i++) { arr[i * 3] = c.r; arr[i * 3 + 1] = c.g; arr[i * 3 + 2] = c.b; }
    if (groupColors && g.groups.length) {
      g.groups.forEach(gr => {
        const gc = new THREE.Color(groupColors[gr.materialIndex] ?? color);
        for (let i = gr.start; i < gr.start + gr.count; i++) { arr[i * 3] = gc.r; arr[i * 3 + 1] = gc.g; arr[i * 3 + 2] = gc.b; }
      });
    }
    g.setAttribute('color', new THREE.BufferAttribute(arr, 3));
    return g;
  }
  function mergeGeos(list) {
    let total = 0; list.forEach(g => total += g.attributes.position.count);
    const pos = new Float32Array(total * 3), nor = new Float32Array(total * 3), col = new Float32Array(total * 3);
    let o = 0;
    for (const g of list) { pos.set(g.attributes.position.array, o); nor.set(g.attributes.normal.array, o); col.set(g.attributes.color.array, o); o += g.attributes.position.count * 3; }
    const m = new THREE.BufferGeometry();
    m.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    m.setAttribute('normal', new THREE.BufferAttribute(nor, 3));

  /* walking: around your own fire, past any other fire, up to the tree, and back */
  const RS = 3.35;
  function arcTo(out, c, r, a0, a1) {
    let d = a1 - a0; d = Math.atan2(Math.sin(d), Math.cos(d));
    const n = Math.max(1, Math.ceil(Math.abs(d) / 0.3));
    for (let i = 1; i <= n; i++) { const a = a0 + d * i / n; out.push(new V3(c.x + Math.cos(a) * r, 0, c.z + Math.sin(a) * r)); }
  }
  function segCircle(P, Q, C, r) {
    const dx = Q.x - P.x, dz = Q.z - P.z, fx = P.x - C.x, fz = P.z - C.z;
    const A = dx * dx + dz * dz, B = 2 * (fx * dx + fz * dz), Cc = fx * fx + fz * fz - r * r;
    const disc = B * B - 4 * A * Cc;
    if (A < 1e-6 || disc <= 0) return null;
    const sq = Math.sqrt(disc), t0 = (-B - sq) / (2 * A), t1 = (-B + sq) / (2 * A);
    if (t0 < 0 || t1 > 1) return null;
    return { t0, t1 };
  }
  function routeTo(out, P, Q, skip) {
    let best = null;
    FIRES.forEach(F => { if (skip.has(F.i)) return; const h = segCircle(P, Q, F.c, RS); if (h && (!best || h.t0 < best.t0)) best = { F, ...h }; });
    if (!best) { out.push(Q.clone()); return; }
    const A = P.clone().lerp(Q, best.t0), B = P.clone().lerp(Q, best.t1), c = best.F.c;
    out.push(A);
    arcTo(out, c, RS + 0.05, Math.atan2(A.z - c.z, A.x - c.x), Math.atan2(B.z - c.z, B.x - c.x));
    skip.add(best.F.i);
    routeTo(out, B, Q, skip);
  }
  function planWalk(p, a, y) {
    const F = FIRES[p.fire], c = F.c, seat = F.seats[p.seat];
    const a0 = Math.atan2(seat.position.z - c.z, seat.position.x - c.x);
    const start = new V3(c.x + Math.cos(a0) * RS, 0, c.z + Math.sin(a0) * RS);
    const goal = new V3(Math.cos(a) * (env(y) + 0.42), 0, Math.sin(a) * (env(y) + 0.42));
    const pts = [start];
    arcTo(pts, c, RS, a0, Math.atan2(goal.z - c.z, goal.x - c.x));
    routeTo(pts, pts[pts.length - 1], goal, new Set([F.i]));
    const cum = [0];
    for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + pts[i].distanceTo(pts[i - 1]));
    return { pts, cum, len: cum[cum.length - 1] };
  }
  function along(path, d, out) {
    const { pts, cum } = path;
    d = Math.max(0, Math.min(d, path.len));

  const lerpAngle = (a, b, k) => a + Math.atan2(Math.sin(b - a), Math.cos(b - a)) * k;
  const smooth = k => k * k * (3 - 2 * k);

  function startWish(p, w, mine) {
    if (p.fire < 0 || p.seat < 0) { addNote(w, true); return; }
    if (p.act) finishAct(p);

    p.act = { phase: 'stand', t: 0, w, mine, path, back: reversePath(path), seatPos: FIRES[p.fire].seats[p.seat].position.clone(), yaw0: seatYaw(p), yaw: seatYaw(p), hang: hangPoint(w.a, w.y), phi: 0 };

  function finishAct(p) {
    const A = p.act;

  function poseSit(p) {

  const STAND = 0.8, HANG = 2.0, WAVE = 1.9, SPEED = 1.35, STRIDE = 0.55;
  function applyBody(p, pos, y, yaw, sitW, phi, moving) {
    p.grp.position.set(pos.x, y, pos.z);
    p.grp.rotation.set(0, yaw, 0);
    p.legs.forEach((l, i) => {
      const sw = moving ? Math.sin(phi + i * PI) : 0;
      const hipW = -0.55 * sw, kneeW = moving ? 0.12 + 0.6 * Math.max(0, Math.sin(phi + i * PI - 1.3)) : 0.04;

  const _pos = new V3(), _tmp = new V3();
  function runAct(p, dt, t) {
    const A = p.act, standY = SEAT_H + p.T * p.scale;

      const to = A.phase === 'stand' ? A.path.pts[0] : A.seatPos;
      _pos.copy(from).lerp(to, k);
      sitW = 1 - up;
      y = SEAT_H + (standY - SEAT_H) * up + Math.sin(PI * k) * 0.28;
      const dirYaw = A.phase === 'stand' ? Math.atan2(A.path.pts[1].x - A.path.pts[0].x, A.path.pts[1].z - A.path.pts[0].z) : A.yaw0;
      A.yaw = lerpAngle(A.phase === 'stand' ? A.yaw0 : A.yaw, dirYaw, A.phase === 'stand' ? k : Math.min(1, k * 1.5));

      moving = true;
      y = standY + Math.abs(Math.sin(A.phi)) * 0.035;
      if (d >= path.len) { A.phase = A.phase === 'walk' ? 'hang' : 'sit'; A.t = 0; A.yaw0 = A.phase === 'sit' ? seatYaw(p) : A.yaw; }
    } else if (A.phase === 'hang') {

      const face = Math.atan2(A.hang.x - _pos.x, A.hang.z - _pos.z);

      A.yaw = lerpAngle(A.yaw, away, Math.min(1, dt * 5));
      const w = Math.max(0, Math.min(1, A.t / 0.35, (WAVE - A.t) / 0.3));

  }

  function onLamp(gltf) {

    const p = o.userData.person;
    if (p.isMe) myWave();
    else p.tagUntil = clockT + 3;
  });

  /* ---------- resize ---------- */
  function resize() {
    const w = innerWidth, h = innerHeight;
    renderer.setSize(w, h);
    composer.setPixelRatio(PR);
    composer.setSize(w, h);
    camera.aspect = w / h;
    camera.fov = w / h < 0.75 ? 64 : w / h < 1.1 ? 56 : 48;
    camera.updateProjectionMatrix();
  }
  addEventListener('resize', resize);
  resize();
  if (innerWidth / innerHeight < 0.75) camera.position.multiplyScalar(1.15);

  /* ---------- loop ---------- */
  const clock = new THREE.Clock();
  const easeBack = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
  const easeInOut = x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
  const motion = reduceMotion ? 0.35 : 1;
  let frames = 0, lightClock = 0;
  const tagV = new V3();

  function tick() {
    const dt = Math.min(clock.getDelta(), 0.05);
    clockT += dt;
    const t = clockT, tm = t * motion;

    star.rotation.y += dt * 0.5 * motion;
    flameMat.uniforms.uTime.value = tm;
    for (const { im, list } of bulbSets) {
      const a = im.instanceColor.array;
      for (let i = 0; i < list.length; i++) {
        const b = list[i];
        let k = 1;
        if (b.tw) { const s = 0.5 + 0.5 * Math.sin(tm * b.tw + b.ph); k = 0.25 + 0.75 * s * s; }
        a[i * 3] = b.c.r * k; a[i * 3 + 1] = b.c.g * k; a[i * 3 + 2] = b.c.b * k;
      }
      im.instanceColor.needsUpdate = true;
    }
    for (let i = 0; i < embers.length; i++) {
      const e = embers[i];
      e.y += e.v * dt * motion;
      if (e.y > 2.6) { e.y = 0.15; e.ph = Math.random() * TAU; }
      const spread = e.r * (1 + e.y * 0.35), sway = Math.sin(t * 1.3 + e.ph) * 0.08 * e.y;
      emberPos[i * 3] = e.cx + Math.cos(e.ph) * spread + sway;
      emberPos[i * 3 + 1] = e.y;
      emberPos[i * 3 + 2] = e.cz + Math.sin(e.ph) * spread;
      const k = (1 - e.y / 2.6) * (0.55 + 0.45 * Math.sin(t * 9 + e.ph * 5));
      emberCol[i * 3] = 3.2 * k; emberCol[i * 3 + 1] = 1.1 * k; emberCol[i * 3 + 2] = 0.25 * k;
    }
    emberGeo.attributes.position.needsUpdate = true;
    emberGeo.attributes.color.needsUpdate = true;
    lightClock += dt;
    if (lightClock > 0.5) { lightClock = 0; assignFireLights(); }
    fireLights.forEach(l => { const ph = l.userData.ph || 0; l.intensity = 2.1 + 0.35 * Math.sin(tm * 7.3 + ph) + 0.25 * Math.sin(tm * 13.1 + ph * 2); });

    if (snowPts.visible) {
      for (let i = 0; i < SNOW_N; i++) {
        const v = sv[i * 2], ph = sv[i * 2 + 1];
        sp[i * 3 + 1] -= v * dt * motion;
        sp[i * 3] += Math.sin(t * 0.7 + ph) * 0.35 * dt * motion;
        sp[i * 3 + 2] += Math.cos(t * 0.5 + ph) * 0.2 * dt * motion;
        if (sp[i * 3 + 1] < 0) { sp[i * 3 + 1] += SKY_H; sp[i * 3] = rr(-SPAN / 2, SPAN / 2); sp[i * 3 + 2] = rr(-SPAN / 2, SPAN / 2); }
      }
      snowGeo.attributes.position.needsUpdate = true;
    }

    for (const p of people.values()) {
      if (!p.grp.visible) continue;
      const ph = p.ph;
      if (p.act) {
        runAct(p, dt, t);
        p.blink -= dt;
        if (p.blink < 0) { p.eyes.scale.y = 0.12; if (p.blink < -0.12) { p.blink = 2.2 + Math.random() * 3.3; p.eyes.scale.y = 1; } }
        continue;
      }
      if (p.born >= 0) {
        const k = Math.min(1, (t - p.born) / 0.7);
        p.grp.scale.setScalar(p.scale * Math.max(0.001, easeBack(k)));
        if (k >= 1) p.born = -1;
      }
      p.upper.rotation.z = Math.sin(tm * 0.9 + ph) * 0.04;
      p.upper.rotation.x = Math.sin(tm * 0.7 + ph) * 0.025;
      const look = Math.pow(Math.max(0, Math.sin(t * 0.11 + ph)), 4);
      p.head.rotation.y = Math.sin(tm * 0.23 + ph * 2) * 0.5 * (1 - look);
      p.head.rotation.z = Math.sin(tm * 0.37 + ph) * 0.12;
      p.head.rotation.x = -0.3 * look;
      p.blink -= dt;
      if (p.blink < 0) { p.eyes.scale.y = 0.12; if (p.blink < -0.12) { p.blink = 2.2 + Math.random() * 3.3; p.eyes.scale.y = 1; } }
      let w = 0;
      if (p.wave > 0) { p.wave -= dt; w = Math.max(0, Math.min(1, p.wave / 0.4, (2.4 - p.wave) / 0.35)); }
      p.armL.rotation.set(p.rest.lx, 0, p.rest.lz);
      p.armR.rotation.set(p.rest.rx + (-2.6 - p.rest.rx) * w, 0, p.rest.rz + (0.35 + Math.sin(t * 11) * 0.45 - p.rest.rz) * w);
    }

    if (camTween) {
      const k = easeInOut(Math.min(1, (t - camTween.t0) / camTween.d));
      controls.target.lerpVectors(camTween.fT, camTween.tT, k);
      camera.position.lerpVectors(camTween.fP, camTween.tP, k);
      if (k >= 1) camTween = null;
    }
    controls.update();
    composer.render();
    frames++;
    if (assetsDone && frames > 2 && !loadingEl.classList.contains('done')) {
      loadingEl.classList.add('done');
      for (const p of people.values()) if (!p.isMe) p.tagUntil = t + 5;
    }

    const W = innerWidth, H = innerHeight;
    for (const p of people.values()) {
      const wantTag = p.grp.visible && (showTags || t < p.tagUntil), wantSay = p.grp.visible && t < p.sayUntil;
      let tagOn = false, sayOn = false;
      if (wantTag || wantSay) {
        tagV.set(0, p.top, 0);
        p.grp.localToWorld(tagV);
        tagV.project(camera);
        const onScreen = tagV.z < 1 && Math.abs(tagV.x) < 1.05 && Math.abs(tagV.y) < 1.05;
        tagOn = wantTag && onScreen; sayOn = wantSay && onScreen;
        if (onScreen) {
          const x = ((tagV.x + 1) / 2 * W).toFixed(1), y = ((1 - tagV.y) / 2 * H).toFixed(1);
          const z = String(1000 - Math.round(p.grp.position.distanceTo(camera.position) * 10));
          if (tagOn) { p.tagEl.style.transform = 'translate3d(' + x + 'px,' + y + 'px,0) translate(-50%,-100%)'; p.tagEl.style.zIndex = z; }
          if (sayOn) { p.sayEl.style.transform = 'translate3d(' + x + 'px,' + y + 'px,0) translate(-50%,' + (tagOn ? 'calc(-100% - 28px)' : '-100%') + ')'; p.sayEl.style.zIndex = String(+z + 1000); }
        }
      }
      if (tagOn !== p.tagEl.classList.contains('on')) p.tagEl.classList.toggle('on', tagOn);
      if (sayOn !== p.sayEl.classList.contains('on')) p.sayEl.classList.toggle('on', sayOn);
    }
    for (let i = bubbles.length - 1; i >= 0; i--) {
      const b = bubbles[i];
      if (t > b.until) { b.el.remove(); bubbles.splice(i, 1); continue; }
      tagV.copy(b.note.pos).project(camera);
      const on = tagV.z < 1 && Math.abs(tagV.x) < 1.05 && Math.abs(tagV.y) < 1.05;
      b.el.classList.toggle('on', on && t < b.until - 0.3);
      if (on) b.el.style.transform = 'translate3d(' + ((tagV.x + 1) / 2 * W).toFixed(1) + 'px,' + ((1 - tagV.y) / 2 * H).toFixed(1) + 'px,0) translate(-50%,calc(-100% - 46px))';
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  /* ---------- start: pick a transport, then find a seat ---------- */
  (async () => {
    let t;
    try {
      if (window.claude && typeof window.claude.use === 'function') t = (await claudeTransport()) || soloTransport('혼자 보는 중');
      else t = await trysteroTransport();
    } catch (err) {
      console.warn('함께 보기에 연결하지 못했어요', err);
      t = soloTransport('연결하지 못해 혼자 보는 중');
    }
    net = t;
    let queued = false;
    net.onChange(() => { if (queued) return; queued = true; setTimeout(() => { queued = false; reconcile(); }, 60); });
    await nameChosen;
    findSeat(0);
    setInterval(() => { if (spectating && !seating) findSeat(0); }, 30000);
    try {
      const st = window.claude && typeof window.claude.use === 'function' ? await claudeStore() : await firebaseStore();
      store = st || localStore(window.claude ? 'claude' : fbWhy);
    } catch (err) {
      console.warn('소원 저장소에 연결하지 못했어요', err);
      store = localStore('error');
    }
    store.subscribe(onStoredNotes);
    setWishBusy(false);
  })();
})();
</script>
